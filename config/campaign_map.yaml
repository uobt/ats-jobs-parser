# Шаблон разметки кампаний. Рабочий файл — config/campaign_map.yaml — в git
# не хранится: в нём uuid боевых кампаний, коды офферов и цитаты из писем.
#
# Зачем нужен: кампании, названные не по конвенции
# {client}__{vertical}__{sub}__{offer}__{list}__v{n}, парсер имён не разбирает.
# Здесь им проставляется разметка вручную (или через веб-UI, вкладка «Разметка»).
#
# Приоритет источников: БД-override → этот файл → парсер имени.
# Минимум для аналитики: client + vertical + offer_code. Либо skip: true.
#
# Как группируется: кампании с одинаковыми offer_code и list_code складываются
# в один вариант. Различие только в offer_code = тест офферов, только в
# list_code = тест баз. Если варьируется и то и другое, движок раскладывает
# группу на управляемые сравнения сам.
campaigns:
  00000000-0000-0000-0000-000000000001:
    client: example
    vertical: payments
    subvertical: fintech
    offer_code: speed_over_swift
    list_code: apollo_eu_uk
    note: 'Чем подтверждается offer_code — цитата из первого письма'

  00000000-0000-0000-0000-000000000002:
    client: example
    vertical: payments
    subvertical: fintech
    offer_code: speed_over_swift
    list_code: apollo_asia
    note: 'Тот же оффер на другой базе — вместе с записью выше это list-тест'

  00000000-0000-0000-0000-000000000003:
    skip: true
    note: 'Пустой черновик или служебная кампания — из аналитики исключена'
